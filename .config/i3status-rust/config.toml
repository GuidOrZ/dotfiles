[theme]
theme = "custom"

[icons]
icons = "none"

[icons.overrides]
music_play  = "[Play]"
music_pause = "[Stop]"

# --- Bluetooth
[[block]]
block = "bluetooth"
mac = ""
disconnected_format = ""
format = " $name $percentage "

[block.battery_state]
"0..20" = "critical"
"21..70" = "warning"
"71..100" = "good"

# --- Scratchpad
[[block]]
block = "scratchpad"

[block.theme_overrides]
idle_fg = "#c7b0f0"

# --- Music
[[block]]
block = "music"
format = " {$combo.str(max_w:20,rot_interval:1.5) $play |}"

[block.theme_overrides]
info_fg = "#abcdef"

# --- Volume
[[block]]
block = "sound"
format = " V: $volume "

[[block.click]]
button = "left"
cmd = "pavucontrol"

# -- Network
[[block]]
block = "net"
format = " $ip "

# --- Temperature
[[block]]
block = "temperature"
scale = "celsius"

format = " T: $max "
format_alt = " Max: $max Min: $min "
interval = 10

# --- Memory
[[block]]
block = "memory"
format = "$mem_used "

# --- GPU
[[block]]
block = "amd_gpu"
format = " G:$utilization "
format_alt = " G:$vram_used_percents ($vram_used/$vram_total) "
interval = 3

# --- CPU
[[block]]
block = "cpu"
interval = 3
format = " C:$utilization "
format_alt = " $frequency{ $boost|} "
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

# --- Time
[[block]]
block = "time"
interval = 60

[block.format]
full = " $timestamp.datetime(f:'%d-%m-%y %R', l:fr_BE) "

[block.theme_overrides]
idle_fg = "#fdeadc"
