# ~/.config/tmux/.tmux.conf


# --- Change prefix from C-b to C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# --- Reload config quickly
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# --- Splits
unbind '"'
unbind %

bind _ split-window -h
bind - split-window -v

# --- Pane navigation
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# --- Mouse support
set -g mouse on
bind-key -n MouseDown2Pane run "wl-paste | tmux load-buffer - && tmux paste-buffer"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"

# --- WINDOW BEHAVIOR
# Prevent automatic renaming of windows
set-option -g allow-rename off

# --- VISUAL / STYLE SETTINGS

# --- Disable bells/alerts noise
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# --- Clock
setw -g clock-mode-colour yellow

# --- Copy mode styling
setw -g mode-style 'fg=black bg=red bold'

# --- Pane borders
set -g pane-border-format "#{pane_index}"

set -g pane-border-lines simple

set -g pane-border-style 'fg=white'
set -g pane-active-border-style 'fg=magenta'

# --- Status bar
set -g status-position top
set -g status-justify left

# Left
set -g status-left "#{?client_prefix,#[fg=#f38ba8][^A],#[fg=#6c7086][^A]} #(git branch --show-current 2>/dev/null) "

# Right
set -g status-right "\
#[fg=#89b4fa]#(echo #{pane_current_path} | sed \"s|$HOME|~|\")\
    #[fg=pink]  \
#[fg=#a6e3a1]#(tmux display-message -p '#{pane_current_command}')\
    #[fg=#pink]"

set -g status-style 'fg=red, bg=#3b3052'
set -g status-left-style "bg=#3b3052"
set -g status-right-style "bg=#3b3052"
set -g status-right-length 50

# --- Window status
set -g window-status-format "#I  "
set -g window-status-current-format "#I  "

# window number always matches posion
set -g renumber-windows on

set -g window-status-current-style "fg=magenta, bold"
set -g window-status-style "fg=pink"
set -g window-status-separator "][ "

# --- Alerts
setw -g window-status-bell-style 'fg=yellow bg=red bold'

# --- Messages
set -g message-style 'fg=yellow bg=red bold'

bind C-c new-window -c "#{pane_current_path}"

# --- Popup Windows
bind C-g display-popup \
    -d "#{pane_current_path}" \
    -w 80% \
    -h 80% \
    -E 'lazygit'

bind C-f display-popup \
    -d "#{pane_current_path}" \
    -w 90% \
    -h 80% \
    -E 'ranger'

bind C-t display-popup \
    -d "#{pane_current_path}" \
    -w 70% \
    -h 55%
